{% extends "base.html" %}
{% block title %}Login — MedFlow{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header">Sign in to MedFlow</div>
            <div class="card-body text-center py-5">
                <i class="bi bi-heart-pulse-fill" style="font-size:3rem;color:var(--mf-blue-500);"></i>
                <p class="text-muted mt-3">
                    Sign in with your hospital group Keycloak account.
                    Your role (Nurse, Pharmacist, Admissions, etc.) determines
                    what the assistant can see and do.
                </p>
                <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg mt-2">
                    <i class="bi bi-shield-lock"></i> Sign in with Keycloak
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
